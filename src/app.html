<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/favicon.ico" sizes="any" />
	<link rel="icon" href="/icon.png" type="image/png" sizes="192x192" />
	<link rel="apple-touch-icon" href="/icon.png" />
	<meta name="theme-color" content="#000000" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description"
		content="The ultimate tool to strip commercial trackers from your URLs. Sanitize links privately. No logs, no trace. An ethical engineering beta for a cleaner web." />

	<!-- Open Graph / WhatsApp / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://notracer.com/" />
	<meta property="og:title" content="NoTracer | Share the content, not your data." />
	<meta property="og:description"
		content="The ultimate tool to strip commercial trackers from your URLs. Sanitize links privately. No logs, no trace. An ethical engineering beta for a cleaner web." />
	<meta property="og:image" content="https://notracer.com/og-image.png" />
	<meta property="og:site_name" content="NoTracer" />

	<!-- Twitter -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:url" content="https://notracer.com/" />
	<meta name="twitter:title" content="NoTracer | Share the content, not your data." />
	<meta name="twitter:description"
		content="The ultimate tool to strip commercial trackers from your URLs. Sanitize links privately. No logs, no trace. An ethical engineering beta for a cleaner web." />
	<meta name="twitter:image" content="https://notracer.com/og-image.png" />
	<title>NoTracer | Share the content, not your data.</title>

	<!-- Google Fonts: Space Mono -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
		rel="stylesheet">

	<!-- Cloudflare Turnstile -->
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
